name: MSSV Production P0 FFmpeg Gate

on:
  push:
    branches:
      - mssv/prod-compatible-p0-377f3b7e
    paths:
      - '.github/workflows/mssv-port-prod-p0.yml'
      - 'TS3AudioBot/Audio/FfmpegProducer.cs'
      - 'TS3AudioBot/Audio/FfmpegStartAdmissionGate.cs'
      - 'TS3ABotUnitTests/FfmpegProducerTests.cs'
      - 'TS3ABotUnitTests/FfmpegStartAdmissionGateTests.cs'
      - 'tools/mssv_port_p0_eagain.py'
  workflow_dispatch:

# Temporary write permission is required only until the already-tested surgical
# patch is materialized in FfmpegProducer.cs. A follow-up commit converts this
# workflow to read-only validation.
permissions:
  contents: write

jobs:
  port-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact compatibility branch
        uses: actions/checkout@v4
        with:
          ref: mssv/prod-compatible-p0-377f3b7e
          fetch-depth: 0

      - name: Materialize tested FFmpeg P0 port
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/mssv_port_p0_eagain.py
          git diff --check
          grep -Fq 'FfmpegStartGate' TS3AudioBot/Audio/FfmpegProducer.cs
          grep -Fq 'EAGAIN/errno 11' TS3AudioBot/Audio/FfmpegProducer.cs
          grep -Fq 'HLS URL detected' TS3AudioBot/Audio/FfmpegProducer.cs

      - name: Setup .NET 6 compatibility SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install dotnet-script
        shell: bash
        run: dotnet tool install --global dotnet-script --version 1.5.0

      - name: Restore tests
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet --info
          dotnet restore TS3ABotUnitTests/TS3ABotUnitTests.csproj

      - name: Run P0 regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet test TS3ABotUnitTests/TS3ABotUnitTests.csproj \
            -c Release \
            --no-restore \
            --verbosity normal \
            --filter 'FullyQualifiedName~FfmpegProducerTests|FullyQualifiedName~FfmpegStartAdmissionGateTests'

      - name: Commit the validated runtime source once
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- TS3AudioBot/Audio/FfmpegProducer.cs; then
            echo 'Runtime source already contains the validated P0 port.'
            exit 0
          fi
          git config user.name 'mssv-github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add TS3AudioBot/Audio/FfmpegProducer.cs
          git commit -m 'fix: materialize FFmpeg EAGAIN admission gate'
          git push origin HEAD:mssv/prod-compatible-p0-377f3b7e
