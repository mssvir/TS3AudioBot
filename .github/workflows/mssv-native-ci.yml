name: MSSV Native CI

on:
  push:
    branches:
      - master
      - 'mssv/**'
    paths:
      - 'native/**'
      - 'conformance/**'
      - '.github/workflows/mssv-native-ci.yml'
      - 'MSSV_NATIVE_CPP_ROADMAP.md'
  pull_request:
    branches:
      - master
    paths:
      - 'native/**'
      - 'conformance/**'
      - '.github/workflows/mssv-native-ci.yml'
      - 'MSSV_NATIVE_CPP_ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }} + ASan/UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -Eeuo pipefail
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMSSV_ENABLE_SANITIZERS=ON

      - name: Build
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake --build build/native --parallel 2

      - name: Test
        shell: bash
        run: |
          set -Eeuo pipefail
          ctest --test-dir build/native --output-on-failure

  systemd-cgroup:
    name: systemd + cgroup v2 cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build process-tree fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake -S native -B build/native-systemd -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/native-systemd --target mssv_process_tree_fixture --parallel 2

      - name: Verify transient unit cgroup cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          bash native/tests/systemd_cgroup_integration.sh \
            build/native-systemd/mssv_process_tree_fixture

  ffmpeg-integration-resource:
    name: FFmpeg lifecycle + resource baseline
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja and FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg
          ffmpeg -version | head -n 1

      - name: Configure and build FFmpeg integration targets
        shell: bash
        run: |
          set -Eeuo pipefail
          FFMPEG="$(command -v ffmpeg)"
          cmake -S native -B build/native-ffmpeg -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMSSV_FFMPEG_EXECUTABLE="$FFMPEG"
          cmake --build build/native-ffmpeg \
            --target mssv_ffmpeg_process_integration_tests mssv_ffmpeg_resource_baseline \
            --parallel 2

      - name: Verify synthetic FFmpeg lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          ctest --test-dir build/native-ffmpeg \
            -R '^mssv_ffmpeg_process_integration_tests$' \
            --output-on-failure

      - name: Measure synthetic FFmpeg fan-out resources
        shell: bash
        run: |
          set -Eeuo pipefail
          FFMPEG="$(command -v ffmpeg)"
          BASELINE_FILE="${RUNNER_TEMP}/mssv-ffmpeg-resource-baseline.txt"
          build/native-ffmpeg/mssv_ffmpeg_resource_baseline "$FFMPEG" 6 | tee "$BASELINE_FILE"
          {
            echo '### MSSV native FFmpeg resource baseline'
            echo ''
            echo 'Synthetic local lavfi/sine workload; hosted-runner measurements are informational, not production capacity limits.'
            echo ''
            echo '```text'
            cat "$BASELINE_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
