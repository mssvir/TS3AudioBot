name: MSSV CI

on:
  push:
    branches:
      - master
      - 'mssv/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore, build and test with the legacy runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:3.1-buster \
            bash -lc '
              set -Eeuo pipefail
              dotnet --info
              dotnet restore TS3AudioBot.sln
              dotnet build TS3AudioBot.sln -c Release --no-restore
              dotnet test TS3ABotUnitTests/TS3ABotUnitTests.csproj -c Release --no-build --no-restore
            '
